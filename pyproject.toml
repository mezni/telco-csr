[project]
name = "telco-cust-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
